# Valori di partenza di PISTAK. Non modificare questo file: le impostazioni personali vanno in user.toml nella
# cartella di configurazione dell'utente (vedi `pistak config` o Analisi ▸ Impostazioni nella finestra), e lì si
# scrive solo ciò che si vuole cambiare.

[limits]
# Soglie del sito "Analizzatore di π-stack" (moleculesfriends.eu). Unità: Å e gradi.
max_dihedral = 20.0        # sopra questo angolo tra i piani medi la coppia è "inclinata"
max_interplanar = 4.2      # sopra questa distanza interplanare non c'è π-stack
contact_cutoff = 4.0       # due molecole sono vicine se hanno atomi pesanti più vicini di così
ring_rms = 0.10            # un anello è planare se lo scarto quadratico dal piano è sotto questo
molecule_rms = 0.15        # idem per il nucleo π intero
bond_tolerance = 0.4       # legame se d < somma dei raggi covalenti + tolleranza
same_site = 0.3            # due posizioni più vicine di così sono lo stesso atomo
max_ring_size = 8
neighbour_shells = 2       # celle vicine esplorate in ogni direzione (minimo: in modalità canonical si allarga da solo)
ring_pair_max_distance = 6.0   # Cg···Cg massimo per elencare una coppia di anelli (fase 2)
max_cell_atoms = 6000     # il sito, nel browser, si fermava a 2500
# criterio di stack, oltre ad angolo e distanza: sovrapposizione > min_overlap
overlap_measure = "atoms"  # atoms: frazione di atomi di un nucleo dentro il contorno dell'altro (sito) | area: area comune / nucleo minore
min_overlap = 0.0          # il sito: basta un atomo dentro il contorno
max_slip = 0.0             # Å; 0 = nessun limite allo slittamento
# convenzioni (quelle del sito: pair_mode = "site", disorder = "first")
pair_mode = "canonical"    # canonical: una coppia per contatto, equivalenza dalle operazioni del gruppo | site: come il sito
disorder = "major"         # major: componente con occupanza maggiore | first: gruppo 1 | all: tutto | 2, 3…: quel gruppo
fragments = "all"          # all: tutti i sistemi di anelli planari di ogni molecola | largest: solo il più grande (sito)
min_fragment_atoms = 5     # atomi minimi di un frammento π secondario (il principale si tiene sempre)
long_axis_atoms = ""       # asse lungo da due atomi, per etichetta ("C1,C9"); vuoto = direzione di massima estensione

[gui]
language = "it"            # it | en | auto (auto = lingua del sistema) — si cambia anche dal menu Lingua
background = "auto"        # auto | light | dark — si cambia anche da Vista ▸ Tema
show_hydrogens = true
sphere_scale = 0.28
stick_radius = 0.11
export_scale = 3           # i PNG della vista 3D si disegnano 3 volte più grandi del pannello
