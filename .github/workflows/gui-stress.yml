# Solo sul ramo ci-gui-crash (da non unire): i test dell'interfaccia ripetuti 12 volte sotto gdb, per riprodurre e
# localizzare il segmentation fault intermittente di test_comparison_window_all_in_english.
name: gui-stress

on:
  push:
    branches: [ci-gui-crash]
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Librerie di sistema per Qt, gdb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 gdb
      - name: Dipendenze
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test dell'interfaccia, 15 volte sotto gdb
        run: |
          fails=0
          for i in $(seq 1 15); do
            if gdb -q -batch -return-child-result -ex "set pagination off" -ex run -ex "bt 40" -ex "info threads" \
                 -ex "thread apply all bt 25" --args python -m pytest -m gui -q -x -p no:cacheprovider > run_$i.log 2>&1; then
              echo "run $i: ok ($(grep -oE '[0-9]+ passed' run_$i.log | tail -1))"
            else
              fails=$((fails+1)); echo "=== run $i FAILED"
              grep -n -A200 'SIGSEGV' run_$i.log | head -260
            fi
          done
          echo "failures: $fails/15"
          test $fails -eq 0
