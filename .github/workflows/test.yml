# Test e lint a ogni push e pull request (checklist di revisione, sezione 10, passo 1).
# I CIF della CSD (DATI_REALI/) non sono nel repository: quei casi si saltano con un messaggio esplicito.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  calcolo:
    # il nucleo di calcolo con le sole dipendenze obbligatorie (numpy, scipy) più spglib, su tutte le versioni supportate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dipendenze
        run: python -m pip install "numpy>=1.26" "scipy>=1.11" "spglib>=2.0" -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check pistak tests validation
      - name: Test senza interfaccia grafica
        run: python -m pytest -m "not gui" -q -rs

  gui:
    # le viste Qt senza schermo (piattaforma offscreen); il rendering 3D si salta se manca OpenGL
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test dell'interfaccia grafica
        run: python -m pytest -m gui -q -rs
